[package]
name = "kssd-review-simd"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[dependencies]
simd-minimizers = { path = "../third_party/simd-minimizers" }
seq-hash = { path = "../third_party/seq-hash" }
serde_json = "=1.0.150"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = true
incremental = false

[[bin]]
name = "rolling_score_benchmark"
path = "src/bin/rolling_score_benchmark.rs"

[[bin]]
name = "common_selector_benchmark"
path = "src/bin/common_selector_benchmark.rs"

[[bin]]
name = "end_to_end_benchmark"
path = "src/bin/end_to_end_benchmark.rs"

[[bin]]
name = "correctness_smoke"
path = "src/bin/correctness_smoke.rs"
