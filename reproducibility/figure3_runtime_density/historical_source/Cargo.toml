[package]
name = "kssd-speed-density"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[dependencies]
seq-hash = { path = "seq-hash" }
serde_json = "=1.0.150"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = true
incremental = false

[[bin]]
name = "speed_density"
path = "main.rs"
